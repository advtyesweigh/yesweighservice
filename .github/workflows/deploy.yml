name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time — overlapping runs race Firebase Rules releases (HTTP 409).
# Queue instead of cancel so a nearly finished deploy is not killed mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to resolve the last successful deploy SHA for functions catch-up.
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can diff functions/ against the last successful deploy.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.23.0 breaks firebase-tools OAuth (Premature close); 22.23.1+ fixes nodejs/node#63989.
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      # App version comes from src/app-version.json. Each push to main bumps
      # 7.0 → 7.1 → … → 7.9 → 8.0 and commits it back with [skip ci].
      - name: Bump app version
        id: bump_version
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'bump app version')
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/app-version.json > src/app-version.json
          node scripts/bump-app-version.mjs
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src/app-version.json','utf8')).version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cp src/app-version.json "${RUNNER_TEMP}/app-version.json"

      - name: Commit app version
        if: steps.bump_version.outcome == 'success'
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add "${RUNNER_TEMP}/version-main" origin/main
          cp "${RUNNER_TEMP}/app-version.json" "${RUNNER_TEMP}/version-main/src/app-version.json"
          git -C "${RUNNER_TEMP}/version-main" add src/app-version.json
          if git -C "${RUNNER_TEMP}/version-main" diff --cached --quiet; then
            echo "App version already ${VERSION} on main — nothing to commit."
          else
            git -C "${RUNNER_TEMP}/version-main" commit -m "chore: bump app version to ${VERSION} [skip ci]"
            git -C "${RUNNER_TEMP}/version-main" push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/ci-write-firebase-credentials.mjs

      - name: Prepare functions environment
        env:
          ZOHO_ORGANIZATION_ID: ${{ secrets.ZOHO_ORGANIZATION_ID }}
          ZOHO_WEBHOOK_SECRET: ${{ secrets.ZOHO_WEBHOOK_SECRET }}
          YESWEIGH_EMBED_SECRET: ${{ secrets.YESWEIGH_EMBED_SECRET }}
          MEEZAN_CATALOG_WEBHOOK_URL: ${{ secrets.MEEZAN_CATALOG_WEBHOOK_URL }}
          MEEZAN_CATALOG_WEBHOOK_SECRET: ${{ secrets.MEEZAN_CATALOG_WEBHOOK_SECRET }}
        run: |
          if [ -z "$ZOHO_ORGANIZATION_ID" ]; then
            echo "::error::Add GitHub Actions secret ZOHO_ORGANIZATION_ID (Zoho Inventory → Settings → Organization Profile → Organization ID)."
            exit 1
          fi

          {
            printf 'ZOHO_ORGANIZATION_ID=%s\n' "$ZOHO_ORGANIZATION_ID"
            printf 'ZOHO_WEBHOOK_SECRET=%s\n' "${ZOHO_WEBHOOK_SECRET:-}"
            printf 'YESWEIGH_EMBED_SECRET=%s\n' "${YESWEIGH_EMBED_SECRET:-}"
            printf 'MEEZAN_CATALOG_WEBHOOK_URL=%s\n' "${MEEZAN_CATALOG_WEBHOOK_URL:-}"
            printf 'MEEZAN_CATALOG_WEBHOOK_SECRET=%s\n' "${MEEZAN_CATALOG_WEBHOOK_SECRET:-}"
          } > functions/.env.yesweigh-service

      - name: Deploy hosting, Firestore, and Storage
        run: bash scripts/ci-firebase-deploy.sh hosting,firestore,storage

      - name: Resolve functions deploy base
        id: functions_base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Prefer the last *successful* workflow run on this branch so a failed
          # functions deploy is retried on the next push even if that push only
          # fixes hosting/frontend (no new functions/ files).
          LAST_SUCCESS=""
          if command -v gh >/dev/null 2>&1; then
            LAST_SUCCESS="$(
              gh run list \
                --workflow "${{ github.workflow }}" \
                --branch "${{ github.ref_name }}" \
                --status success \
                --limit 1 \
                --json headSha \
                --jq '.[0].headSha // empty' \
              2>/dev/null || true
            )"
          fi

          BEFORE="${{ github.event.before }}"
          BASE=""
          REASON=""

          if [ -n "$LAST_SUCCESS" ] && [ "$LAST_SUCCESS" != "${{ github.sha }}" ]; then
            if git rev-parse --verify "${LAST_SUCCESS}^{commit}" >/dev/null 2>&1 \
              || git fetch --depth=1 origin "${LAST_SUCCESS}" >/dev/null 2>&1; then
              if git merge-base --is-ancestor "${LAST_SUCCESS}" HEAD 2>/dev/null; then
                BASE="$LAST_SUCCESS"
                REASON="last successful deploy (${LAST_SUCCESS})"
              fi
            fi
          fi

          if [ -z "$BASE" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
              REASON="push before SHA (${BEFORE})"
            else
              BASE="HEAD~1"
              REASON="HEAD~1 (no prior success / before SHA)"
            fi
          fi

          if ! git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Base commit ${BASE} not in clone — fetching from origin"
            git fetch --depth=1 origin "${BASE}" || true
          fi

          if ! git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "::warning::Could not resolve functions base ${BASE}; falling back to HEAD~1"
            BASE="HEAD~1"
            REASON="HEAD~1 (fallback)"
          fi

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Functions diff base: ${BASE} (${REASON})"

      - name: Determine changed functions
        id: changed_functions
        run: |
          BASE="${{ steps.functions_base.outputs.base }}"
          echo "Comparing functions/ against ${BASE} (${{ steps.functions_base.outputs.reason }})"
          mapfile -t lines < <(node functions/scripts/changed-functions.mjs --base "$BASE")
          for line in "${lines[@]}"; do
            echo "$line"
            key="${line%%=*}"
            val="${line#*=}"
            echo "${key}=${val}" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy Functions
        if: steps.changed_functions.outputs.skip != 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.changed_functions.outputs.deploy_all }}" = "true" ]; then
            DEPLOY_TARGET="functions"
            echo "Deploying all functions (shared functions/ change)."
          else
            DEPLOY_TARGET="${{ steps.changed_functions.outputs.deploy_only }}"
            echo "Deploying ${DEPLOY_TARGET} (${{ steps.changed_functions.outputs.count }} function(s))."
          fi

          set +e
          bash scripts/ci-firebase-deploy.sh "$DEPLOY_TARGET"
          status=$?
          set -e

          # Do not follow a selective failure with a second deploy of every
          # function. That repeated Cloud Run health checks for services this
          # commit did not change. ci-firebase-deploy.sh already retries, and
          # only the functions that failed.
          if [ "$status" -ne 0 ]; then
            echo "::warning::Functions deploy had errors."
            echo "::warning::If the log mentions a missing environment variable, add it to functions/.env.yesweigh-service via the Prepare functions environment step (e.g. ZOHO_WEBHOOK_SECRET)."
            echo "::warning::If deploy aborted because a function exists in the project but not in source, CI should pass --force (scripts/ci-firebase-deploy.sh). Or delete manually:"
            echo "::warning::  firebase functions:delete <name> --region asia-south1 --project yesweigh-service"
            echo "::warning::If syncZohoCatalogScheduled failed with cloudscheduler.jobs.update, grant the CI service account:"
            echo "::warning::  Role: Cloud Scheduler Admin (roles/cloudscheduler.admin)"
            echo "::warning::  IAM: https://console.cloud.google.com/iam-admin/iam?project=yesweigh-service"
            echo "FUNCTIONS_DEPLOY_FAILED=true" >> "$GITHUB_ENV"
          fi

      - name: Functions deploy skipped
        if: steps.changed_functions.outputs.skip == 'true'
        run: |
          echo "No functions/ changes since ${{ steps.functions_base.outputs.reason }} — skipping functions deploy (${{ steps.changed_functions.outputs.reason }})."

      - name: Verify Functions deploy
        if: env.FUNCTIONS_DEPLOY_FAILED == 'true'
        run: |
          echo "::error::Functions deploy failed earlier in this workflow."
          echo "::error::Hosting, Firestore, and Storage may still have deployed successfully."
          echo "::error::The next push will re-attempt any functions/ changes since the last successful deploy (even if that push only fixes hosting)."
          echo "::error::Common fixes: ensure functions/.env.yesweigh-service includes ZOHO_WEBHOOK_SECRET (empty is OK); grant Cloud Scheduler Admin to FIREBASE_SERVICE_ACCOUNT if scheduler jobs fail."
          exit 1
